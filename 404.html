    .nf-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .nf-card { max-width: 560px; width: 100%; text-align: center; background: var(--bg2); border: 1px solid var(--border); border-radius: 18px; padding: 48px 32px; }
    .nf-code { font-size: clamp(3.5rem, 10vw, 5.5rem); font-weight: 800; color: var(--accent); line-height: 1; margin-bottom: 12px; }

    .nf-suggest { margin: -10px 0 24px; font-size: .92rem; color: var(--text2); }
    .nf-suggest a { color: var(--accent); font-weight: 600; text-decoration: none; border-bottom: 1px solid rgba(var(--accent-rgb), .4); }
    .nf-suggest a:hover { border-bottom-color: var(--accent); }
    .nf-suggest a:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
    /* r81: the rescue appears mid-load (script runs before deferred i18n) —
       a short fade+rise makes it feel deliberate instead of a pop-in.
       Reduced-motion users get the instant state via the global 0.01ms nuke
       in style.css (404.html loads the estate stylesheet). */
    @keyframes nfSuggestIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
    .nf-suggest:not([hidden]) { animation: nfSuggestIn .28s ease both; }
    .nf-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .nf-actions a { min-height: 44px; display: inline-flex; align-items: center; }
    /* r105: FAQ-search recovery — mirrors the faq-filter input language:
       border-strong functional boundary (r98 taxonomy), accent focus ring,
       16px input font (iOS focus-zoom guard), 44px touch floor (r72).
       Logical margin auto-centering is direction-safe; the btn-primary
       submit reuses the estate button (font already set, r53 wrap-safe). */
    .nf-search { display: flex; gap: 8px; max-width: 380px; margin: -8px auto 24px; }
    .nf-inputwrap { position: relative; flex: 1; min-width: 0; }
    /* r108: kbd chip hides while typing — same language as .faq-filter */
    .nf-search:focus-within .faq-filter-kbd { display: none; }
    /* r109: chip also hides once the field HOLDS a query (even blurred) —
       CSS-only via :placeholder-shown (no JS, form stays zero-JS). Long
       queries no longer slide under the re-appearing chip after blur. */
    .nf-search input:not(:placeholder-shown) ~ .faq-filter-kbd { display: none; }
    .nf-search input {
      width: 100%; box-sizing: border-box; height: 44px;
      padding: 0 14px; padding-inline-end: 34px; /* r108: clear the kbd chip */ background: var(--bg2); color: var(--text);

      font-size: 16px; font-family: var(--font); caret-color: var(--accent-text);
    }
    .nf-search input::placeholder { color: var(--text2); }
    .nf-search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(var(--accent-rgb),.15); }
    .nf-search .btn-primary { min-height: 44px; display: inline-flex; align-items: center; }

    .nf-legal a { color: var(--text2); font-size: .85rem; text-decoration: none; }

  <script>

  <script>
    // r79: 404 rescue — GitHub Pages serves this file at the REQUESTED URL, so
    // location.pathname still names the dead path. Fuzzy-match it against the
    // real page inventory (first-match-wins; specific aliases before bare
    // ones) and surface a localized "did you mean" link. Labels reuse the
    // nav./footer. keys — zero new per-page vocabulary (r69 convention);
    // web3.html is brand-static (null key) like the offline inventory. The
    // suggest box starts hidden: no match → zero visual change. The link
    // carries data-i18n so the deferred i18n.js pass translates it at load
    // and every setLang rebuild retranslates it like all engine text.
    (function() {
      var MAP = [
        ['how-it-works', '/how-it-works.html', 'nav.how'],
        ['howitworks',   '/how-it-works.html', 'nav.how'],
        ['comparison',   '/comparison.html',   'nav.compare'],
        ['compare',      '/comparison.html',   'nav.compare'],
        ['versus',       '/comparison.html',   'nav.compare'],
        ['features',     '/features.html',     'nav.features'],
        ['feature',      '/features.html',     'nav.features'],
        ['download',     '/download.html',     'nav.download'],
        ['android',      '/download.html',     'nav.download'],
        ['apk',          '/download.html',     'nav.download'],
        // r81: billing-cycle typos rescue to the EXACT plan card (r78 anchors
        // + page-local scroll-margin already handle the landing). Label stays
        // nav.pricing — the recipient arrives scrolled to the right card.
        // Listed BEFORE the generic pricing aliases: first-match-wins, and a
        // path like /annual-plan should land on the annual card, not the top.
        ['annual',       '/pricing.html#plan-annual',    'nav.pricing'],
        ['yearly',       '/pricing.html#plan-annual',    'nav.pricing'],
        ['quarterly',    '/pricing.html#plan-quarterly', 'nav.pricing'],
        ['monthly',      '/pricing.html#plan-monthly',   'nav.pricing'],
        ['pricing',      '/pricing.html',      'nav.pricing'],
        ['price',        '/pricing.html',      'nav.pricing'],
        ['plan',         '/pricing.html',      'nav.pricing'],
        ['checkout',     '/pricing.html',      'nav.pricing'],
        ['privacy',      '/privacy.html',      'footer.privacy'],
        ['terms',        '/terms.html',        'footer.terms'],
        ['refund',       '/refund.html',       'footer.refund'],
        ['contact',      '/contact.html',      'nav.contact'],
        ['support',      '/contact.html',      'nav.contact'],
        // r124: the Telegram surface — the brand's primary support channel and
        // the most plausible guessed URLs (/telegram, /tg, /bot, /channel).
        // contact.html carries dedicated Support/Bot/Channel cards, so it is
        // the correct rescue target for all four; short aliases sit AFTER the
        // specific rows (first-match-wins, same rule as the pricing block).
        ['telegram',     '/contact.html',      'nav.contact'],
        ['channel',      '/contact.html',      'nav.contact'],
        ['tg',           '/contact.html',      'nav.contact'],
        ['bot',          '/contact.html',      'nav.contact'],
        ['faq',          '/faq.html',          'nav.faq'],
        ['question',     '/faq.html',          'nav.faq'],
        ['web3',         '/web3.html',         null, 'NullVPN Web3'],
        ['mirror',       '/web3.html',         null, 'NullVPN Web3'],
        ['setup',        '/how-it-works.html', 'nav.how'],
        ['guide',        '/how-it-works.html', 'nav.how'],
        ['app',          '/download.html',     'nav.download'],
        ['pay',          '/pricing.html',      'nav.pricing'],
        ['buy',          '/pricing.html',      'nav.pricing'],
        ['vs',           '/comparison.html',   'nav.compare'],
        ['how',          '/how-it-works.html', 'nav.how'],
        ['index',        '/',                  'nav.home'],
        ['home',         '/',                  'nav.home'],
        ['main',         '/',                  'nav.home']
      ];
      var raw = location.pathname || '';
      var path;
      try { path = decodeURIComponent(raw); } catch (_) { path = raw; }
      path = path.toLowerCase().replace(/\.html?$/, '').replace(/^\/+/, '').replace(/\/+$/, '');
      if (!path) return; // root never 404s
      var hit = null;
      for (var i = 0; i < MAP.length; i++) {
        if (path.indexOf(MAP[i][0]) !== -1) { hit = MAP[i]; break; }
      }
      if (!hit) return;
      var box = document.getElementById('nfSuggest');
      var a = document.getElementById('nfSuggestLink');
      if (!box || !a) return;
      a.setAttribute('href', hit[1]);
      if (hit[2]) {
        a.setAttribute('data-i18n', hit[2]);
      } else {
        a.removeAttribute('data-i18n');
        a.textContent = hit[3] || 'NullVPN';
      }
      box.hidden = false;
    })();
  </script>
