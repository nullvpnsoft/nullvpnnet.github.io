    .of-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }

    .of-card .of-sub { color: var(--text2); font-size: .95rem; margin-bottom: 26px; }
    .of-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .of-actions a, .of-actions button { min-height: 44px; display: inline-flex; align-items: center; justify-content: center; }
    .of-retry { border: 0; cursor: pointer; font: inherit; }
    .of-legal { margin-top: 26px; display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; }
    .of-legal a { color: var(--text2); font-size: .85rem; text-decoration: none; }
    /* r69: offline inventory — the sub-copy promises "pages you already
       visited may still be available"; the engine now enumerates the SW
       cache and lists them as chips. Logical properties keep RTL correct;
       44px coarse targets; the label mapping reuses nav./footer. keys so
       every chip is localized for free. */
    .of-head { font-size: .95rem; font-weight: 700; margin: 26px 0 12px; }
    .of-list { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    .of-list a {
      display: inline-flex; align-items: center; min-height: 38px;
      padding: 8px 16px; border-radius: 10px;
      border: 1px solid var(--border-strong); background: var(--bg3); /* r98: offline nav chips are functional links */
      color: var(--text); font-size: .88rem; font-weight: 600;
      text-decoration: none; white-space: nowrap;
      transition: border-color .15s ease, background .15s ease;
    }
    @media (hover: hover) and (pointer: fine) { .of-list a:hover { border-color: var(--accent); background: var(--bg2); } }
    .of-list a:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
    @media (pointer: coarse) { .of-list a { min-height: 44px; } }
    [data-theme="dark"] .of-list a { background: rgba(255,255,255,.06); }
    /* r69: back-online pill — appears when the 'online' event fires while the
       visitor reads this page; reload follows automatically ~900ms later. */
    /* r97: pill -> fixed toast — inserting a fit-content pill at the card
       bottom re-centered the whole card (visible jump in the ~900ms before
       the auto-reload); a fixed toast has zero layout impact. role=status
       and aria-live survive (positioning only). */
    .of-live {
      position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 0);
      margin: 0; width: max-content; max-width: calc(100vw - 32px);
      padding: 9px 18px; border-radius: 999px;
      background: var(--accent); color: var(--accent-text);
      font-size: .88rem; font-weight: 700;
      box-shadow: 0 6px 18px rgba(0,0,0,.28); z-index: 80;
      animation: of-in .25s ease-out;
    }
    @keyframes of-in { from { opacity: 0; transform: translate(-50%, 4px); } to { opacity: 1; transform: translate(-50%, 0); } }
    @media (prefers-reduced-motion: reduce) { .of-live { animation: none; } }
    /* r116: print hygiene — the fixed toast is the last position:fixed element
       without print coverage (r113 closed the checkout overlay; r113's fixed-
       element audit noted this one). Same dead-chrome-on-paper class: it would
       print as an accent slab repeated on every sheet. */
    @media print { .of-live { display: none !important; } }
